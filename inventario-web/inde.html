<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inventario web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>inventario web</h1>
    <input class="correo" type="text" placeholder="ingrese un numero o un correo " pattern="^([0-9]+|[a-zA-Z0-9._%+-]+@[a-z-z0-9.-]+\[a-zA-Z]{2,})$" title="ingrese un numero o un correo electronico valido" required>
    <input class="contraseña" type="number " placeholder="ingrese su contraseña">
    <button class="iniciar-seccion"> iniciar sección</button>
    <button class="crear-cuenta">crear cuenta</button>
    <p class="recup">se me olvido la contraseña</p>
    <button class="recuperar">recuperar</button>
</body>
</html>
